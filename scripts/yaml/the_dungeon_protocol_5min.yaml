metadata:
  title: "The Dungeon Protocol: Strategic Incubation in the Void"
  description: "A briefing on Joseph's management of scarcity and the virtue of invisibility. Sacred Realism Noir."
  output_file: "the_dungeon_protocol_1080p.mp4"
  fps: 30
  width: 1920
  height: 1080

segments:
  # 0:00 - 0:45: THE HOOK
  - type: "narration"
    text: "What if your current effort is completely invisible to the world? What if your silence isn't a failure of destiny, but a calculated deployment of time?"
    duration: 15
    start_time: 0
    bg_image: "Stone_room_with_oil_lamp_202606151120.jpeg"
  
  - type: "macro"
    text: "STRATEGIC INVISIBILITY"
    duration: 10
    start_time: 15
    bg_image: "Stone_room_with_oil_lamp_202606151120.jpeg"

  - type: "narration"
    text: "The mistake most people make when analyzing Joseph is believing he succeeded because he was a victim. He didn't. He succeeded because he learned to manage scarcity in the darkness of a dungeon."
    duration: 20
    start_time: 25
    bg_image: "Ancient_scrolls_and_tablet_202606151120.jpeg"

  # 0:45 - 2:15: THE ARCHIVE (Context)
  - type: "verse"
    text: "But the Lord was with Joseph, and shewed him mercy, and gave him favour in the sight of the keeper of the prison. - Genesis 39:21"
    duration: 15
    start_time: 45
    bg_image: "Ancient_scrolls_and_tablet_202606151120.jpeg"

  - type: "narration"
    text: "The prison was not a punishment; it was a laboratory. It was the only environment where Joseph could master the mechanics of administration without the noise of the palace. Anonymity is the only soil where true leadership capability is pressure-tested."
    duration: 30
    start_time: 60
    bg_image: "Stone_room_with_oil_lamp_202606151120.jpeg"

  - type: "macro"
    text: "THE INCUBATION PHASE"
    duration: 15
    start_time: 90
    bg_image: "Stone_room_with_oil_lamp_202606151120.jpeg"

  - type: "narration"
    text: "In the void, Joseph stopped being a dreamer and started being an operator. He managed the prisoners, the logistics, and the morale of the forgotten. He optimized a failing system until he became the system itself."
    duration: 30
    start_time: 105
    bg_image: "Ancient_scrolls_and_tablet_202606151120.jpeg"

  # 2:15 - 3:45: STRATEGIC ANALYSIS (Scarcity Management)
  - type: "narration"
    text: "When the king finally called, Joseph didn't offer a religious platitude. He offered a 14-year economic protocol. He identified a systemic collapse—the coming famine—and proposed a solution based on state-level hoarding and distribution."
    duration: 30
    start_time: 135
    bg_image: "Geopolitical_command_and_control_center_202605041546.jpeg"

  - type: "macro"
    text: "SCARCITY PROTOCOL"
    duration: 15
    start_time: 165
    bg_image: "Geopolitical_command_and_control_center_202605041546.jpeg"

  - type: "narration"
    text: "He turned a natural disaster into a geopolitical consolidation of power. By the end of the famine, the Pharaoh owned the land, the livestock, and the people—all because one man knew how to manage bread in the dark."
    duration: 30
    start_time: 180
    bg_image: "War_room_with_holographic_maps_202606151120.jpeg"

  - type: "narration"
    text: "If you are in a season of obscurity, do not rush to the light. The palace has no room for amateurs. It only has room for those who have already mastered the dungeon."
    duration: 30
    start_time: 210
    bg_image: "Desert_landscape_with_ruins_202606151120.jpeg"

  # 3:45 - 5:00: THE ORDER
  - type: "narration"
    text: "Your current invisibility is not a malfunction. It is a dam holding back the force before your ascent. Stop looking for applause and start looking for the levers of your current prison."
    duration: 30
    start_time: 240
    bg_image: "Stone_room_with_oil_lamp_202606151120.jpeg"

  - type: "narration"
    text: "Master the small logistics of your void. Build your capability in secret. When the protocol of your promotion is activated, the world will see the results—but they will never understand the process."
    duration: 20
    start_time: 270
    bg_image: "Throne_room_with_crown_shadows_202606151120.jpeg"

  - type: "macro"
    text: "MASTER THE VOID"
    duration: 10
    start_time: 290
    bg_image: "Desert_landscape_with_ruins_202606151120.jpeg"
